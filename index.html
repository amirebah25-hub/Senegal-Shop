<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sénégal Shop — Tout au même endroit</title>
<style>
:root{--green:#087443;--red:#d71920;--yellow:#f5c400;--ink:#172018;--muted:#667067;--bg:#f7f8f7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0001}
.top{display:flex;align-items:center;gap:18px;padding:14px 4%;max-width:1280px;margin:auto}
.logo{font-weight:900;font-size:26px;line-height:.9;color:var(--green)}.logo span{color:var(--red)}
.search{flex:1;display:flex;border:1px solid #ddd;border-radius:12px;overflow:hidden}.search input{flex:1;padding:13px;border:0;outline:0}.search button{background:var(--green);color:#fff;border:0;padding:0 18px}
nav{display:flex;gap:22px;padding:0 4% 14px;max-width:1280px;margin:auto}nav a{color:var(--ink);text-decoration:none;font-weight:600}
.hero{background:linear-gradient(110deg,#dff5e9,#fff5bd);padding:55px 6%;display:flex;align-items:center;justify-content:space-between;gap:30px}.hero h1{font-size:clamp(38px,6vw,70px);margin:0}.hero h1 span{color:var(--red)}.hero p{font-size:21px;color:#3f493f}.btn{border:0;border-radius:10px;padding:13px 20px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.yellow{background:var(--yellow)}
.container{max-width:1280px;margin:auto;padding:28px 4%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.cat,.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000b}.cat{font-weight:800;cursor:pointer}.cat b{display:block;font-size:34px;margin-bottom:10px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.product-img{height:150px;border-radius:12px;background:#eef3ef;display:flex;align-items:center;justify-content:center;font-size:62px}.price{font-size:20px;font-weight:900;color:var(--green)}.card h3{margin:10px 0 7px}.card button{width:100%;margin-top:10px}.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.benefit{background:#fff;padding:18px;border-radius:14px;text-align:center}.cart{position:fixed;right:18px;bottom:18px;background:var(--red);color:#fff;border:0;border-radius:50px;padding:16px 20px;font-weight:900;box-shadow:0 8px 25px #0003;cursor:pointer}.drawer{position:fixed;right:0;top:0;width:min(420px,100%);height:100%;background:#fff;z-index:10;transform:translateX(100%);transition:.25s;box-shadow:-5px 0 25px #0002;padding:22px;overflow:auto}.drawer.open{transform:none}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.close{float:right;background:none;border:0;font-size:25px}.total{font-size:22px;font-weight:900;margin:18px 0}footer{background:#102017;color:#fff;padding:35px 4%;margin-top:35px}
.admin-btn{background:#172018;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.admin{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:center;justify-content:center;padding:15px}.admin.open{display:flex}.admin-box{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:20px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin input,.admin select,.admin textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.admin textarea{min-height:90px;resize:vertical}.admin label{font-weight:700;font-size:14px}.admin-field{display:flex;flex-direction:column;gap:6px}.admin-list{margin-top:18px}.admin-item{display:flex;align-items:center;gap:10px;border:1px solid #eee;border-radius:12px;padding:10px;margin-top:8px}.admin-item img{width:55px;height:55px;object-fit:cover;border-radius:10px;background:#eef3ef}.admin-item .grow{flex:1}.danger{background:#d71920;color:#fff}.secondary{background:#eef3ef;color:#172018}.hint{font-size:13px;color:#667067;background:#f7f8f7;padding:10px;border-radius:10px;margin:12px 0}@media(max-width:700px){.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}nav{overflow:auto}.hero{padding:35px 5%}.benefits{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">SÉNÉGAL <span>SHOP</span><small style="display:block;font-size:10px;color:#555;margin-top:5px">Tout au même endroit</small></div>
    <div class="search"><input id="search" placeholder="Rechercher un produit..."><button onclick="render()">🔎</button></div>
    <button class="btn yellow" onclick="openCart()">🛒 <span id="count">0</span></button>
  </div>
  <nav><a href="#">Accueil</a><a href="#categories">Catégories</a><a href="#products">Produits</a><a href="#benefits">Services</a></nav>
</header>


<section class="hero">
  <div><h1>SÉNÉGAL <span>SHOP</span></h1><p>La qualité à portée de main 🇸🇳</p><button class="btn primary" onclick="document.querySelector('#products').scrollIntoView()">Découvrir les produits →</button></div>
  <div style="font-size:110px">🛍️🇸🇳</div>
</section>


<main class="container">
<section id="categories"><div class="section-title"><h2>Nos catégories</h2></div>
